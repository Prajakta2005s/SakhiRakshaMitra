<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Sakhi RakshaMitra - Live Location
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  background: #f5f5f5;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.container {

  max-width: 600px;

  margin: auto;

}

.header {

  background: #c62828;

  color: white;

  padding: 22px;

  border-radius: 15px;

  text-align: center;

}

.header h1 {

  margin: 0;

  font-size: 25px;

}

.header p {

  margin: 7px 0 0;

  font-size: 14px;

}

.status {

  margin-top: 15px;

  background: white;

  padding: 15px;

  border-radius: 12px;

  text-align: center;

  font-weight: bold;

}

.location {

  margin-top: 15px;

  background: white;

  padding: 20px;

  border-radius: 12px;

}

.location h2 {

  margin-top: 0;

}

.coordinate {

  font-size: 16px;

  margin: 10px 0;

}

.accuracy {

  color: #555;

  font-size: 14px;

}

.time {

  color: #777;

  font-size: 13px;

  margin-top: 12px;

}

.button {

  display: block;

  margin-top: 20px;

  padding: 15px;

  background: #c62828;

  color: white;

  text-decoration: none;

  text-align: center;

  border-radius: 8px;

  font-weight: bold;

}

.refresh {

  margin-top: 15px;

  color: #777;

  font-size: 13px;

  text-align: center;

}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>
📍 Live Location
</h1>

<p>
Sakhi RakshaMitra
</p>

</div>


<div
id="status"
class="status"
>

🔄 Getting current location...

</div>


<div class="location">

<h2>
📍 Current Location
</h2>


<div
id="coordinates"
class="coordinate"
>

Waiting for location...

</div>


<div
id="accuracy"
class="accuracy"
>
</div>


<div
id="updated"
class="time"
>
</div>


<a
id="googleMaps"
class="button"
href="#"
target="_blank"
>

📍 Open in Google Maps

</a>


</div>


<div class="refresh">

Location automatically refreshes every 5 seconds.

</div>


</div>


<script>

const params =
new URLSearchParams(
window.location.search
);

const locationId =
params.get(
"locationId"
);


async function getLocation() {

if (!locationId) {

document.getElementById(
"status"
).innerText =
"⚠️ Location ID is missing.";

return;

}


try {

const response =
await fetch(
"/api/live-location?locationId=" +
encodeURIComponent(
locationId
),
{
cache: "no-store"
}
);


const data =
await response.json();


if (
!response.ok ||
!data.success
) {

document.getElementById(
"status"
).innerText =
"⚠️ Live location unavailable.";

return;

}


const location =
data.location;


document.getElementById(
"status"
).innerText =
"🟢 Live location active";


document.getElementById(
"coordinates"
).innerText =

"Latitude: " +
location.latitude +
" | Longitude: " +
location.longitude;


if (
location.accuracy !== null &&
location.accuracy !== undefined
) {

document.getElementById(
"accuracy"
).innerText =

"GPS Accuracy: approximately " +
location.accuracy +
" meters";

}


if (
location.timestamp
) {

const date =
new Date(
location.timestamp
);


document.getElementById(
"updated"
).innerText =

"Last updated: " +
date.toLocaleString();

}


const mapsUrl =

"https://www.google.com/maps?q=" +
location.latitude +
"," +
location.longitude;


document.getElementById(
"googleMaps"
).href =
mapsUrl;


} catch (error) {

console.log(
error
);


document.getElementById(
"status"
).innerText =
"⚠️ Unable to update location.";

}

}


// First request

getLocation();


// Update every 5 seconds

setInterval(
getLocation,
5000
);

</script>

</body>

</html>
